packages:
  - packages/*

# pnpm 11 refuses to run a dependency's build scripts unless it is listed here,
# and treats an undecided one as a hard install error. Locally the decision is
# cached under node_modules, so this only surfaces on a clean checkout — which
# is every CI job, and was the first thing CI failed on.
#
# lefthook's postinstall places its platform binary, which the root `prepare`
# script then uses to install the git hooks.
allowBuilds:
  lefthook: true

minimumReleaseAgeExclude:
  - '@emquad/typst-binding-darwin-arm64@0.0.1'
  - '@emquad/typst-binding-darwin-x64@0.0.1'
  - '@emquad/typst-binding-linux-arm64-gnu@0.0.1'
  - '@emquad/typst-binding-linux-arm64-musl@0.0.1'
  - '@emquad/typst-binding-linux-x64-gnu@0.0.1'
  - '@emquad/typst-binding-linux-x64-musl@0.0.1'
  - '@emquad/typst-binding-win32-arm64-msvc@0.0.1'
  - '@emquad/typst-binding-win32-x64-msvc@0.0.1'
