packages:
  - packages/*

# pnpm 11 refuses to run a dependency's build scripts unless it is listed here,
# and treats an undecided one as a hard install error. Locally the decision is
# cached under node_modules, so this only surfaces on a clean checkout — which
# is every CI job, and was the first thing CI failed on.
#
# lefthook's postinstall places its platform binary, which the root `prepare`
# script then uses to install the git hooks.
allowBuilds:
  lefthook: true

# pnpm 11 refuses to install any version published less than a day ago
# (`minimumReleaseAge`, default 1440 minutes) as a supply-chain measure. Our own
# platform packages are published and then depended on within minutes, so they
# hit that wall on every release — the delay exists to let the ecosystem notice
# a malicious upload, which is not a risk model that applies to a package we
# just built and pushed ourselves.
#
# A pattern rather than the eight `@0.0.1` entries this started as: pinned
# versions would have to be rewritten for every release, and the failure mode of
# forgetting is a release that cannot install itself.
minimumReleaseAgeExclude:
  - '@emquad/typst-binding-*'
