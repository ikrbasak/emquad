version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
        # Typst is pinned to an exact version (`=0.15.1`) because it is pre-1.0
        # and breaks across minor releases — `FileId::new` and
        # `VirtualPath::new` both changed in 0.15. A typst bump is a deliberate,
        # reviewed change with a re-run of the golden files, never an
        # automatic one.
        exclude-patterns: ["typst*", "comemo"]
    ignore:
      - dependency-name: typst*
      - dependency-name: comemo

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Matches pnpm's `minimumReleaseAge`, which defaults to 1440 minutes in
    # pnpm 11: it refuses to install any version published less than a day ago,
    # as a supply-chain measure. Dependabot opens a PR the moment a version
    # lands, so without this every npm update arrives already red — CI fails at
    # `pnpm install --frozen-lockfile` with
    # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION and stays that way until the clock
    # runs out. A recurring, self-healing failure is worse than a slow one: it
    # teaches reviewers that red on a Dependabot PR means nothing.
    #
    # Two days rather than one, so a PR opened just inside the window is still
    # installable by the time anyone looks at it.
    cooldown:
      default-days: 2
    groups:
      dev-tooling:
        patterns: ["oxlint", "oxfmt", "typescript", "tsdown", "turbo", "@types/*", "lefthook", "@commitlint/*"]
      napi:
        patterns: ["@napi-rs/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
