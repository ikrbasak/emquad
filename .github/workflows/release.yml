# Publish.
#
# Live since 0.0.1. Every preflight condition below is now satisfied, so this
# runs end to end; it is kept as a gate because each check corresponds to a way
# the first publish actually went wrong.
#
# **The bootstrap is not this workflow.** 0.0.1 was published by
# `scripts/initial-publish.sh`, run from a laptop, and that ordering is forced
# rather than chosen: pnpm silently excludes an optional dependency it cannot
# resolve and never records it in the lockfile, so declaring
# `optionalDependencies` on packages no registry serves makes
# `pnpm install --frozen-lockfile` fail in every CI job, permanently. The
# platform packages must exist in the registry before anything can depend on
# them — which means the first publish cannot be done by a workflow that
# installs the workspace first. npm trusted publishing has the same
# chicken-and-egg problem: OIDC cannot publish a package that does not yet
# exist (npm/cli#8544).
#
# Consequence for anyone adding a *new* platform package: it has to be published
# out-of-band before it can be added to `optionalDependencies`, exactly as the
# original eight were. See `.claude/phase-4/00-publishing.md`.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack, but do not publish.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Fail before spending an hour on a matrix build that cannot be published.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # These check the *state of the tree*, not a hardcoded package name. An
      # earlier version asserted that `@emquad/core` did not depend on
      # `@emquad/binding` specifically, which the Phase 4 rename would have
      # satisfied while leaving the actual problem — a dependency on something
      # unpublishable — completely intact.
      - name: The binding is publishable
        run: |
          fail=0

          if ! node -e "
            const pkg = require('./packages/binding/package.json');
            process.exit(pkg.napi?.packageName ? 0 : 1);
          "; then
            echo "::error::packages/binding/package.json needs napi.packageName (e.g. @emquad/typst-binding)."
            echo "Without it @napi-rs/cli generates platform packages named after the package"
            echo "itself, and the loader looks for names that will never be published."
            fail=1
          fi

          if node -e "
            const pkg = require('./packages/binding/package.json');
            process.exit(pkg.private ? 0 : 1);
          "; then
            echo "::error::packages/binding is still private, so nothing depending on it can publish."
            echo "Drop \`private\` once its optionalDependencies are declared below."
            fail=1
          fi

          # The loader resolves @emquad/typst-binding-<platform> at require time.
          # Published without these declared, it installs cleanly and then throws
          # on first use with no binding found for the platform.
          if ! node -e "
            const pkg = require('./packages/binding/package.json');
            const declared = Object.keys(pkg.optionalDependencies ?? {});
            const targets = pkg.napi?.targets ?? [];
            process.exit(declared.length >= targets.length && targets.length > 0 ? 0 : 1);
          "; then
            echo "::error::packages/binding declares fewer optionalDependencies than napi.targets."
            echo "Every target needs its @emquad/typst-binding-<platform> package listed, or the"
            echo "loader will find nothing at runtime on that platform."
            echo "Publish the platform packages BEFORE adding these: pnpm cannot lock a specifier"
            echo "that no registry serves, and --frozen-lockfile then fails in every job."
            fail=1
          fi

          # Every workspace dependency of @emquad/core must itself be publishable.
          if ! node -e "
            const fs = require('fs');
            const core = require('./packages/core/package.json');
            const deps = Object.keys(core.dependencies ?? {});
            const bad = deps.filter((name) => {
              for (const dir of fs.readdirSync('./packages')) {
                const path = './packages/' + dir + '/package.json';
                if (!fs.existsSync(path)) continue;
                const pkg = require(path);
                if (pkg.name === name && pkg.private) return true;
              }
              return false;
            });
            if (bad.length) console.error('unpublishable: ' + bad.join(', '));
            process.exit(bad.length ? 1 : 0);
          "; then
            echo "::error::@emquad/core depends on a private workspace package (named above)."
            echo "pnpm publish will refuse it."
            fail=1
          fi

          exit $fail

      # Deliberately *not* checked here: that the loader's optionalDependencies
      # match the version being released. In the committed tree they point at
      # the **previous** release, and they have to — pnpm cannot lock a
      # specifier no registry serves, so bumping them before the platform
      # packages are published turns `--frozen-lockfile` red in every job on
      # every branch. They are rewritten during publish, between the platform
      # packages going out and the loader following them.

  build:
    name: Build
    needs: preflight
    uses: ./.github/workflows/build-native.yml
    with:
      upload-artifacts: true

  verify:
    name: Verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: packages/binding

      - name: Every target produced a binary
        run: |
          count=$(find packages/binding -maxdepth 1 -name '*.node' | wc -l | tr -d ' ')
          echo "found $count binaries"
          find packages/binding -maxdepth 1 -name '*.node' -exec ls -la {} +
          # Matches the matrix in build-native.yml. A silently missing target
          # becomes an install failure for whoever is on that platform.
          if [ "$count" -ne 8 ]; then
            echo "::error::expected 8 platform binaries, found $count"
            exit 1
          fi

      - run: pnpm turbo run build
      - run: pnpm turbo run test

      # The packed tarballs are what users actually receive. Pack them here so
      # the artifact that gets published is the artifact that was tested.
      - name: Pack
        run: |
          mkdir -p dist-tarballs
          for pkg in core resolver fonts; do
            pnpm --filter "@emquad/$pkg" pack --pack-destination "$PWD/dist-tarballs"
          done
          ls -la dist-tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: tarballs
          path: dist-tarballs/
          if-no-files-found: error

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.dry-run == false
    environment: npm
    permissions:
      contents: read
      # Required for OIDC. It is also what signs the provenance attestation,
      # which npm generates automatically on the trusted-publishing path.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Re-run purely for the registry URL, which writes the .npmrc that
      # NODE_AUTH_TOKEN is read through on the fallback path.
      #
      # That .npmrc is also why pnpm 11.1.3 is a hard floor for OIDC here.
      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` unconditionally, and
      # older pnpm sent the *literal* unexpanded placeholder as a bearer token
      # when the variable was unset — the registry answered 404 and OIDC never
      # got a turn. pnpm/pnpm#11526 made unresolved placeholders drop to empty,
      # which is what lets the token simply be absent. `packageManager` pins
      # 11.17.0, so this is satisfied; do not lower it without rechecking.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          merge-multiple: true
          path: packages/binding

      - run: pnpm turbo run build

      # Authentication is OIDC first, token only if OIDC cannot work.
      #
      # The fallback is explicit — two steps, not one step with both
      # credentials present — because npm does not document which wins when a
      # trusted publisher and a static token are both available. Relying on
      # that precedence would mean the difference between a short-lived OIDC
      # credential and a long-lived token being invisible in the log. Here the
      # step name says which one ran.
      #
      # The token cannot be removed outright, and not only for outages: **a
      # package that does not yet exist cannot be published over OIDC at all.**
      # npm requires the package to exist before a trusted publisher can be
      # configured for it (npm/cli#8544), so every one of these packages needs
      # one token-authenticated release before OIDC can ever take over. See
      # `scripts/initial-publish.sh`.
      #
      # ORDER MATTERS below, and getting it wrong is not recoverable by
      # retrying. The platform packages must exist on the registry *before*
      # @emquad/core, or the first person to install it resolves
      # optionalDependencies that are not there yet and silently gets no native
      # binding. Republishing core does not repair an install that already
      # failed.
      - name: Publish platform packages (OIDC)
        id: platform_oidc
        continue-on-error: true
        working-directory: packages/binding
        run: pnpm exec napi pre-publish --npm-dir npm --tag-style npm

      - name: Publish platform packages (token fallback)
        if: steps.platform_oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::OIDC publish failed and no NPM_TOKEN secret is set."
            exit 1
          fi
          echo "::warning::Published the platform packages with a long-lived token; OIDC did not succeed."
          cd packages/binding && pnpm exec napi pre-publish --npm-dir npm --tag-style npm

      # **This is the only point at which the loader can name this release's
      # binaries.** `napi version` bumps the eight platform packages and leaves
      # the loader's `optionalDependencies` alone, so without this step the
      # loader publishes pinned to the *previous* release's binaries: it
      # installs, it loads, it compiles, with stale native code, drifting one
      # release further every time, and nothing downstream notices.
      #
      # It cannot be done earlier and committed. pnpm cannot lock a specifier no
      # registry serves, so a committed bump fails `--frozen-lockfile` in every
      # job until the platform packages exist — which is exactly the ordering
      # that forced a laptop script for `0.0.1`. The packages exist as of the
      # step above, so this is the first moment it is true.
      - name: Point the loader at the platform packages just published
        run: node scripts/sync-binding-optional-deps.mjs

      # `changeset publish` rather than a hand-ordered loop, for two properties
      # the loop did not have. It publishes in topological order, so
      # `@emquad/typst-binding` goes out before the `@emquad/core` that depends
      # on it without anyone maintaining the list. And it skips any package
      # whose version is already on the registry — which is also what makes the
      # retry below safe rather than a source of duplicate-publish errors.
      #
      # `--no-git-tag`: this workflow is triggered by a `v*` tag that already
      # exists, and per-package tags would need `contents: write` for nothing.
      - name: Publish packages (OIDC)
        id: packages_oidc
        continue-on-error: true
        run: pnpm exec changeset publish --no-git-tag

      - name: Publish packages (token fallback)
        id: packages_token
        if: steps.packages_oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::OIDC publish failed and no NPM_TOKEN secret is set."
            exit 1
          fi
          echo "::warning::Published with a long-lived token; OIDC did not succeed."
          pnpm exec changeset publish --no-git-tag

      # `continue-on-error` on the OIDC step means the job would otherwise go
      # green when OIDC failed and the fallback was skipped. Assert that one of
      # them actually ran, and record which — the whole point of splitting them
      # is that the credential used is visible afterwards.
      - name: Confirm a publish path ran
        env:
          OIDC: ${{ steps.packages_oidc.outcome }}
          TOKEN: ${{ steps.packages_token.outcome }}
        run: |
          if [ "$OIDC" = "success" ]; then
            echo "packages published via OIDC"
          elif [ "$TOKEN" = "success" ]; then
            echo "::warning::packages published via a long-lived token, not OIDC"
          else
            echo "::error::neither publish path succeeded (oidc=$OIDC token=$TOKEN)"
            exit 1
          fi
