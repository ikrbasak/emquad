name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A superseded run tells you nothing. Cancel in-flight work on a branch when new
# commits arrive, but never on `main` — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Rust's incremental compilation is a pessimization in CI: every job starts
  # from a restored cache and never compiles the same crate twice.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Nothing here compiles Rust or builds the addon, so both jobs
  # report in about a minute.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the range between the base and the head.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings .

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # Deliberately builds nothing: every tsconfig's `include` covers `src`
      # only, and @emquad/binding's declarations are committed.
      - run: pnpm turbo run typecheck

  # Rust lints need a compile, so they are their own job rather than holding up
  # the JavaScript feedback above.
  clippy:
    name: Clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: `rust-toolchain.toml` pins the version and rustup
      # installs it on first use. Naming it here would be a second source of
      # truth that silently drifts.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Hard rule 4. Zero `-sys` crates is what keeps the build matrix
      # affordable, and it is lost one careless dependency at a time.
      - name: No -sys crates
        run: ./scripts/check-no-sys-crates.sh

  licenses:
    name: Licenses and attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # A prebuilt binary, not `cargo install` — building it from source cost
      # two and a half minutes for a tool that runs for twenty seconds.
      #
      # Pinned, because the step below compares generated output byte for byte:
      # an unpinned tool lets a new cargo-about release fail CI with no change
      # to our dependencies at all.
      - name: Install cargo-about
        env:
          VERSION: 0.9.1
        run: |
          url="https://github.com/EmbarkStudios/cargo-about/releases/download/${VERSION}"
          asset="cargo-about-${VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL "${url}/${asset}.tar.gz" | tar -xz --strip-components=1 -C /usr/local/bin "${asset}/cargo-about"
          cargo about --version

      - run: cargo deny check licenses

      # THIRD-PARTY-NOTICES.md is committed so attribution changes appear in a
      # diff rather than only in a CI log. This asserts the committed copy is
      # the one the current dependency tree produces.
      - name: THIRD-PARTY-NOTICES.md is current
        run: |
          cargo about generate --output-file THIRD-PARTY-NOTICES.md about.hbs
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is stale. Run \`pnpm notices\` and commit the result."
            # The full diff, not a stat. A one-line difference between a
            # macOS-generated file and a Linux-generated one is a fact about the
            # tool rather than about our dependencies, and telling those apart
            # needs the actual line.
            git --no-pager diff --unified=2 -- THIRD-PARTY-NOTICES.md | head -100
            exit 1
          fi

      - name: Upload the regenerated notices
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The real suite: every supported OS against every supported Node major.
  #
  # The addon itself is ABI-stable across Node majors (Node-API 9), so this is
  # not about the binary. It is about the JavaScript around it: the worker pool
  # forks child processes, talks to them over structured-clone IPC, and kills
  # them with a signal on timeout — and all three are places where behavior
  # differs by OS *and* by Node version, not by one or the other. A pool bug
  # that only appears on Windows under Node 26 is exactly the shape of thing
  # this grid is for.
  #
  # `cargo test` runs once per OS rather than once per cell. It does not touch
  # Node, so repeating it across the three majors would only buy three copies of
  # the same result at the price of three more Rust builds.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 rather than macos-latest: it is where the golden-file
        # references were generated, so a mismatch there is a real regression
        # while a mismatch only elsewhere points at cross-architecture
        # rasterization instead.
        os: [ubuntu-latest, macos-14, windows-latest]
        node: [22, 24, 26]
        include:
          - os: ubuntu-latest
            node: 22
            rust: true
          - os: macos-14
            node: 22
            rust: true
          - os: windows-latest
            node: 22
            rust: true

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared per OS, not per job: the three Linux rows build the same
          # addon and differ only in which Node runs the JavaScript.
          shared-key: ${{ runner.os }}-debug

      - name: Rust tests
        if: matrix.rust
        run: cargo test --all-features

      # turbo orders these. @emquad/binding's test script builds the addon with
      # the `test-hooks` feature, and the other suites are declared to wait for
      # it rather than racing a half-written binary. Nothing here triggers the
      # release LTO link — that belongs to the release path alone.
      - run: pnpm turbo run test

      # Without the artifact a golden mismatch is a percentage with nothing to
      # look at, and "just regenerate the goldens" becomes the path of least
      # resistance.
      - name: Upload golden-file diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-${{ matrix.os }}-node${{ matrix.node }}
          path: packages/core/test/golden/diff/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Prove every shipping target still builds. Expensive — eight LTO links — so
  # it is gated on whether anything native actually changed.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "native=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE"...HEAD \
            | grep -qE '^(crates/|Cargo\.(toml|lock)|rust-toolchain\.toml|packages/binding/|\.github/)'; then
            echo "native=true" >>"$GITHUB_OUTPUT"
          else
            echo "native=false" >>"$GITHUB_OUTPUT"
          fi

  build-native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native.yml
    with:
      upload-artifacts: false

  # A single required check, so branch protection does not have to enumerate a
  # matrix that changes whenever a target is added.
  ci:
    name: CI
    if: always()
    needs: [lint, clippy, licenses, test, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for result in $results; do
            # `skipped` is legitimate: build-native is gated on whether the
            # native tree changed. `failure` and `cancelled` are not.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$result'"; exit 1 ;;
            esac
          done
