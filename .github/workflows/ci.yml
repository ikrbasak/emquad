name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A superseded run tells you nothing. Cancel in-flight work on a branch when new
# commits arrive, but never on `main` — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Rust's incremental compilation is a pessimization in CI: every job starts
  # from a restored cache and never compiles the same crate twice.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback. Nothing here needs the native addon, so it reports in under a
  # minute rather than waiting behind an LTO link.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs the full range between the base and the head.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No toolchain action: `rust-toolchain.toml` pins the version, and rustup
      # installs it on first use. Naming it here too would create a second
      # source of truth that silently drifts.
      - name: Show Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - run: pnpm exec oxfmt --check .
      - run: pnpm exec oxlint --deny-warnings .
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Hard rule 4. Zero `-sys` crates is what keeps the build matrix
      # affordable, and it is lost one careless dependency at a time.
      - name: No -sys crates
        run: ./scripts/check-no-sys-crates.sh

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Deliberately does not build anything. @emquad/binding's declarations are
      # generated by napi-rs and committed, and no package type-checks against
      # another's build output — so this finishes in seconds.
      - run: pnpm turbo run typecheck

  # ---------------------------------------------------------------------------
  # License compliance. A dependency introducing an unlisted license fails the
  # build, which is the only moment anyone actually reads a license.
  # ---------------------------------------------------------------------------
  licenses:
    name: Licenses and attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: licenses

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `--features cli` is required; without it cargo-about installs as a
      # library and the binary is silently absent.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - run: cargo deny check licenses

      # THIRD-PARTY-NOTICES.md is committed so attribution changes appear in a
      # diff rather than only in a CI log. This asserts the committed copy is
      # the one the current dependency tree produces.
      - name: THIRD-PARTY-NOTICES.md is current
        run: |
          cargo about generate --output-file THIRD-PARTY-NOTICES.md about.hbs
          if ! git diff --quiet -- THIRD-PARTY-NOTICES.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is stale. Run \`pnpm notices\` and commit the result."
            git diff --stat -- THIRD-PARTY-NOTICES.md
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The real suite. Needs the native addon, so it is the long pole.
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 is listed first because it is where the golden-file
          # references were generated — a failure anywhere else is far more
          # likely to be cross-architecture rasterization than a real
          # regression, and having this result to compare against is what makes
          # that distinguishable.
          - os: macos-14
            node: 22
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ matrix.os }}-${{ github.sha }}
          restore-keys: turbo-${{ matrix.os }}-

      - run: cargo test --all-features

      # turbo orders these: @emquad/binding's test script rebuilds the addon
      # with `test-hooks`, and the other suites are declared to wait for it
      # rather than racing a half-written binary.
      - run: pnpm turbo run test

      # The golden tests write the actual render and a diff mask on mismatch.
      # Without these the failure is a percentage with nothing to look at, and
      # "regenerate the goldens" becomes the path of least resistance.
      - name: Upload golden-file diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-${{ matrix.os }}-node${{ matrix.node }}
          path: packages/core/test/golden/diff/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Prove every shipping target still builds. Expensive, so it runs on `main`
  # and on pull requests that touch the Rust tree or the build configuration.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "native=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD \
            | grep -qE '^(crates/|Cargo\.(toml|lock)|rust-toolchain\.toml|packages/binding/|\.github/workflows/)'; then
            echo "native=true" >>"$GITHUB_OUTPUT"
          else
            echo "native=false" >>"$GITHUB_OUTPUT"
          fi

  build-native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/build-native.yml
    with:
      upload-artifacts: false

  # A single required check, so branch protection does not have to enumerate a
  # matrix that changes whenever a target is added.
  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, licenses, test, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for result in $results; do
            # `skipped` is legitimate: build-native is gated on whether the
            # native tree changed. `failure` and `cancelled` are not.
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job reported '$result'"; exit 1 ;;
            esac
          done
