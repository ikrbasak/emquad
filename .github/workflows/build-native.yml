# Build the native addon for every shipping target.
#
# Reusable: CI calls it to prove the matrix still builds, and the release
# workflow calls it with `upload-artifacts: true` to collect the binaries it
# publishes. Keeping one matrix means a target cannot be verified in CI and then
# quietly missing from a release.
#
# Phase 0 verified all fourteen targets compile, including that `psm`/`stacker`
# — the only dependency with per-architecture assembly — assembles for each.
# Eight are wired up here, matching `packages/binding/package.json`.
#
# **The three `win32-*-msvc` targets cannot be cross-compiled from a non-Windows
# host**: `stacker` compiles `windows.c` and `psm` needs `lib.exe`. They build on
# a Windows runner, where MSVC can target arm64 from an x64 host.

name: Build native

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Keep the built `.node` files as workflow artifacts.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            smoke: true

          # The only remaining Intel macOS runner. `macos-13` was retired, and
          # `macos-latest` is arm64 — building x86_64 there would cross-compile
          # and lose the smoke test.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            smoke: true

          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            smoke: true

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            # napi-cross supplies a glibc 2.17 sysroot, which sets the oldest
            # glibc the published binary will run against.
            flags: --use-napi-cross
            smoke: false

          # musl builds inside napi-rs's Alpine image rather than cross-
          # compiling. Alpine is a large share of Node Docker images, which is
          # exactly why the platform suffix has to carry the libc component.
          #
          # The image is what supplies `RUSTFLAGS=-C target-feature=-crt-static`
          # (a musl cdylib needs it) and the aarch64 musl cross toolchain. Its
          # bundled Node is not usable — see the install step below.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            container: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            alpine: true
            smoke: true

          # No `--use-napi-cross` here: it is glibc-only, and passing it for a
          # musl target fails validation outright. The image carries a musl
          # cross toolchain at /aarch64-linux-musl-cross/bin instead, which the
          # env below points cargo and cc at.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            container: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            alpine: true
            muslCross: aarch64-linux-musl
            smoke: false

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            smoke: true

          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            smoke: false

    steps:
      - uses: actions/checkout@v7

      # The Alpine image already carries Node and a toolchain; setup-node inside
      # it fights with that and gains nothing, so corepack and the install are
      # run directly there instead.
      - uses: ./.github/actions/setup
        if: ${{ !matrix.alpine }}

      # The image has not been rebuilt since 2024-12-01 and still carries Node
      # 18, which is below this project's floor and below pnpm 11's own
      # `engines` (>= 22.13) — so its Node cannot run our install at all. Its
      # bundled corepack is stale in a second way: the npm registry rotated its
      # signing keys, and corepack of that vintage rejects the signature with
      # `Cannot find matching keyid`.
      #
      # Both go away by putting a current Node on PATH. `actions/setup-node`
      # cannot: it installs glibc binaries that will not run here. The
      # unofficial musl builds are the only ones Node publishes for Alpine.
      - name: Install Node (Alpine)
        if: ${{ matrix.alpine }}
        shell: sh
        env:
          NODE_VERSION: "24.18.0"
        run: |
          set -eu
          # The base image carries busybox wget, not curl, and xz is a separate
          # package. Each step is its own command rather than a pipeline: this
          # is POSIX sh with no `pipefail`, so a download failure inside
          # `curl | tar` surfaces as a confusing tar error and `set -e` never
          # sees it.
          apk add --no-cache curl xz
          curl -fsSL -o /tmp/node.tar.xz \
            "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64-musl.tar.xz"
          unxz /tmp/node.tar.xz
          tar -xf /tmp/node.tar --strip-components=1 -C /usr/local
          rm /tmp/node.tar
          node --version

      - name: Set up dependencies (Alpine)
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          # The container runs as root over a workspace owned by the runner
          # user, so git refuses it as "dubious ownership". checkout sets this
          # too, but only in a temporary HOME it discards afterwards. It matters
          # because the root `prepare` script runs `lefthook install`, which
          # shells out to git — so the install fails after everything has
          # already been fetched.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Show Rust toolchain
        run: rustup show

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.target }}

      # The image puts the musl cross toolchain on PATH but tells nothing else
      # about it, and its global `CC=clang` would otherwise be used to compile
      # `psm`'s per-architecture assembly for the wrong target. The per-target
      # variables win over `CC` in the `cc` crate, so naming them here is enough.
      - name: Point cargo at the musl cross toolchain
        if: matrix.muslCross
        shell: sh
        env:
          PREFIX: ${{ matrix.muslCross }}
          TRIPLE: ${{ matrix.target }}
        run: |
          set -eu
          under=$(echo "$TRIPLE" | tr '-' '_')
          upper=$(echo "$under" | tr '[:lower:]' '[:upper:]')
          {
            echo "CC_${under}=${PREFIX}-gcc"
            echo "CXX_${under}=${PREFIX}-g++"
            echo "CARGO_TARGET_${upper}_LINKER=${PREFIX}-gcc"
          } >>"$GITHUB_ENV"

      - name: Build
        working-directory: packages/binding
        run: >
          pnpm exec napi build
          --manifest-path ../../crates/emquad-napi/Cargo.toml
          --package-json-path ./package.json
          --platform --esm --release
          --target ${{ matrix.target }}
          ${{ matrix.flags }}
          --output-dir .

      # A binary that builds but will not load is a release incident, and the
      # loader is exactly the part a build cannot exercise. Only runnable where
      # the target's architecture matches the runner's.
      #
      # The script is written into the workspace rather than a temp directory:
      # an ESM relative specifier resolves against the importing *file*, not the
      # working directory, so from /tmp it looked for /tmp/packages/binding.
      - name: Smoke test the addon
        if: matrix.smoke
        shell: bash
        run: |
          cat >smoke.mjs <<'JS'
          import { typstVersion } from "./packages/binding/index.js";
          const version = typstVersion();
          if (version !== "0.15.1") {
            throw new Error(`expected typst 0.15.1, got ${version}`);
          }
          console.log(`loaded ${process.platform}/${process.arch}, typst ${version}`);
          JS
          node ./smoke.mjs
          rm smoke.mjs

      # Hard rule 4, checked per target rather than only on the host: a
      # platform-specific dependency could pull a `-sys` crate in for one
      # target and no other.
      - name: No -sys crates
        if: ${{ !matrix.alpine }}
        run: ./scripts/check-no-sys-crates.sh

      - name: Report binary size
        shell: bash
        run: |
          file=$(ls packages/binding/*.node)
          size=$(wc -c <"$file")
          gzipped=$(gzip -c "$file" | wc -c)
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo "| | bytes |"
            echo "|---|---|"
            echo "| uncompressed | $size |"
            echo "| gzipped | $gzipped |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/binding/*.node
          if-no-files-found: error
          retention-days: 7
