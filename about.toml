# cargo-about — generates THIRD-PARTY-NOTICES.md.
#
#   cargo install cargo-about --locked --features cli
#   pnpm licenses
#
# Every dependency is statically linked into the shipped `.node` binary, so its
# attribution has to ship with the package. The generated file is committed so a
# reviewer can see attribution changes in a diff rather than trusting CI.

# Order matters: where a crate offers a choice, cargo-about takes the first
# license listed here, so MIT leads to match this project's own license. Typst
# itself is Apache-2.0 only, so the binary still carries Apache-2.0 obligations
# regardless — which is the reason this file is generated at all.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "0BSD",
]

# Dev-dependencies never enter the shipped binary, so attributing them would
# overstate what is being distributed.
ignore-dev-dependencies = true

# Only the platforms we actually ship. Without this, cargo-about walks every
# target's dependency graph and attributes crates that never reach our binary.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
