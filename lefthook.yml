# Git hooks. Install with `pnpm install` (the `prepare` script runs
# `lefthook install`) or `pnpm exec lefthook install`.
#
# Everything here also runs in CI. The hooks exist to make the feedback
# immediate, not to be the only place a check happens.

pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: '*.rs'
      run: cargo fmt --all -- --check
      fail_text: 'run `cargo fmt --all`'

    - name: clippy
      glob: '*.{rs,toml}'
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: oxfmt
      glob: '*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc}'
      run: pnpm exec oxfmt --check {staged_files}
      fail_text: 'run `pnpm fmt`'

    # `exclude` mirrors the generated entries in `oxlint.config.ts`'s
    # `ignorePatterns`, and it has to. lefthook decides whether to run this job
    # from its own glob, so staging *only* the generated loader — which every
    # version bump does, since it embeds the version — passed oxlint a file it
    # then ignored, leaving it nothing to lint and exiting 1. The commit was
    # unmakeable with no way to tell from the message why.
    #
    # Keep the two lists in step. The duplication is the price of lefthook not
    # reading the linter's own ignore rules.
    - name: oxlint
      glob: '*.{js,mjs,cjs,ts,mts,cts,jsx,tsx}'
      exclude:
        - packages/binding/index.js
        - packages/binding/index.d.ts
      run: pnpm exec oxlint --deny-warnings {staged_files}

    # The zero-`-sys`-crate property is what makes the wide os/arch matrix
    # affordable (hard rule 4), and it is lost one careless dependency at a
    # time. Catch it at the commit that adds it.
    - name: no-sys-crates
      glob: '*.{toml,lock}'
      run: ./scripts/check-no-sys-crates.sh

pre-push:
  parallel: true
  jobs:
    - name: cargo-test
      run: cargo test --all-features

    # Typechecking, not building. `tsc` is configured with `noEmit` and used
    # purely as a checker — tsdown does the building — so this is the only
    # place type errors are caught.
    - name: typecheck
      glob: '*.{ts,mts,cts}'
      run: pnpm turbo run typecheck

    - name: licenses
      glob: '*.{toml,lock}'
      run: cargo deny check licenses

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
