[workspace]
members = ["crates/emquad-engine", "crates/emquad-napi"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ikrbasak/emquad"
rust-version = "1.85"

# Typst is pre-1.0 and breaks across minor releases — `FileId::new` and
# `VirtualPath::new` both changed in 0.15. Pin exact versions (hard rule 5).
[workspace.dependencies]
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-assets = "=0.15.1"
comemo = "0.5"
rayon = "1"

[workspace.lints.rust]
# `deny` rather than `forbid` only because napi-derive emits `#[allow(unsafe_code)]`
# in its generated glue, which `forbid` refuses outright. Hand-written `unsafe`
# still fails the build. `emquad-engine` keeps the stronger `#![forbid]` at the
# crate root — the pure core has no reason to ever need it.
unsafe_code = "deny"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# Never `panic = "abort"`: it disables `catch_unwind`, which hard rule 2 depends
# on. Typst's `FileId` interner panics via `expect`, and an uncaught panic
# crossing into Node aborts the process.
panic = "unwind"

[profile.bench]
inherits = "release"

# Optimize dependencies even in debug builds. An unoptimized typst is roughly
# two orders of magnitude slower, which makes the Node test suite unusable,
# while our own crates stay unoptimized and quick to rebuild.
[profile.dev.package."*"]
opt-level = 3
