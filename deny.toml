# cargo-deny — dependency policy for the Rust workspace.
#
#   cargo install cargo-deny
#   cargo deny check
#
# Two things are being protected here.
#
# 1. **License compliance.** Everything shipped inside the native binary is
#    statically linked, so every dependency's license terms travel with it and
#    its attribution must appear in THIRD-PARTY-NOTICES.md. The allow-list below
#    is exhaustive rather than permissive: a new license shows up as a build
#    failure, which is the only moment anyone will actually read it.
#
# 2. **The zero-`-sys`-crate property** (hard rule 4). `[bans]` cannot match a
#    suffix, so that check lives in `scripts/check-no-sys-crates.sh`; what is
#    banned here are the specific crates that would drag in a C toolchain.

[graph]
all-features = true

[licenses]
version = 2
# Verified against the full tree: every dependency permissive, none copyleft.
# Re-run `cargo deny check licenses` after any dependency change — this list is
# exhaustive by design, so a new license is meant to fail the build.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # `libloading`, via napi's `dyn-symbols`. Permissive and OSI-approved;
  # functionally equivalent to MIT.
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # Anything that needs OpenSSL, a C compiler, or bindgen breaks the
  # cross-compile matrix. Networking belongs in the TypeScript layer.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "bindgen" },
  { name = "cmake" },
  { name = "reqwest" },
  # Churns heavily and drags in HTTP/TLS (hard rule 7).
  { name = "typst-kit" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
